name: CI

on:
  pull_request:
  push:
    branches: [main, prod]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # jsdom performs no layout, so the unit suite cannot see an overflow at
      # all — which is how #84 survived a measurement pass. This is the only
      # step that reads a real box.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Viewport sweep
        run: npm run test:e2e

      - name: Build
        run: npm run build
