          <p style="color:#52525b">Solve multiplication problems using limited digit tiles. Correct answers replace the tiles you spend and grant one extra tile. Incorrect answers consume your tiles without a reward. Keep your inventory balanced and survive as long as possible.</p>
          <details style="width:100%;text-align:left;border:1px solid #d4d4d8;border-radius:8px;padding:12px 16px">

            <ul style="margin-top:12px;padding-left:24px;display:flex;flex-direction:column;gap:8px">

              <li>Answer slots fill in the order you select tiles: the first tile you choose fills the leftmost slot, so selection order determines the number you submit.</li>
              <li>A correct answer replaces the tiles you spent and grants one extra tile. An incorrect answer removes the tiles you spent and grants no reward.</li>
              <li>Your inventory holds at most ten tiles.</li>
              <li>If a reward would push your inventory past ten tiles, you must choose tiles to discard before play continues.</li>
              <li>Score counts correct answers, streak counts consecutive correct answers, and round shows which equation is currently on screen. Rounds played counts every equation you have submitted, correct or incorrect. The run ends once you hold fewer tiles than the next answer requires.</li>
              <li>Press a digit key to select a matching tile, Backspace to return the most recently selected tile, and Enter to submit, confirm a discard, or continue.</li>
