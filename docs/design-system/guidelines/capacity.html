<!-- @dsCard group="Brand" viewport="700x180" name="Capacity meter" subtitle="Ten pips — the system's stand-in for an icon set." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Capacity</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 180px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .pip { width: 15px; height: 7px; border-radius: 2px; }
</style></head><body><div class="grid" style="gap:12px">
  <div class="col"><span class="cap">capacity 6 / 10</span><div class="row" style="gap:4px"><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:rgba(240,231,214,.16)"></span><span class="pip" style="background:rgba(240,231,214,.16)"></span><span class="pip" style="background:rgba(240,231,214,.16)"></span><span class="pip" style="background:rgba(240,231,214,.16)"></span></div></div>
  <div class="col"><span class="cap">capacity 11 / 10 — over</span><div class="row" style="gap:4px"><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--accent)"></span><span class="pip" style="background:var(--state-discard);margin-left:8px"></span></div></div>
</div></body></html>
