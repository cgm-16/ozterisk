<!-- @dsCard group="Colors" viewport="700x150" name="Ceramic" subtitle="The only light values in the system — tile faces and edges." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ceramic</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 150px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row">
<div class="sw"><span class="chip" style="background:#fdf8ec"></span><span class="col" style="gap:2px"><span class="nm">--clay-050</span><span class="hx">#fdf8ec face top</span></span></div>
<div class="sw"><span class="chip" style="background:#f0e7d6"></span><span class="col" style="gap:2px"><span class="nm">--clay-100</span><span class="hx">#f0e7d6 light field</span></span></div>
<div class="sw"><span class="chip" style="background:#e6d7ba"></span><span class="col" style="gap:2px"><span class="nm">--clay-200</span><span class="hx">#e6d7ba face base</span></span></div>
<div class="sw"><span class="chip" style="background:#b3a184"></span><span class="col" style="gap:2px"><span class="nm">--clay-400</span><span class="hx">#b3a184 fired edge</span></span></div>
<div class="sw"><span class="chip" style="background:#16352b"></span><span class="col" style="gap:2px"><span class="nm">--clay-900</span><span class="hx">#16352b engraved</span></span></div>
</div></body></html>
