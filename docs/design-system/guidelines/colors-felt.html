<!-- @dsCard group="Colors" viewport="700x150" name="Felt field" subtitle="The table. Never more than two in one view." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Felt</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 150px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row">
<div class="sw"><span class="chip" style="background:#071711"></span><span class="col" style="gap:2px"><span class="nm">--felt-900</span><span class="hx">#071711 surround</span></span></div>
<div class="sw"><span class="chip" style="background:#0b211b"></span><span class="col" style="gap:2px"><span class="nm">--felt-800</span><span class="hx">#0b211b panel</span></span></div>
<div class="sw"><span class="chip" style="background:#14342a"></span><span class="col" style="gap:2px"><span class="nm">--felt-700</span><span class="hx">#14342a canvas</span></span></div>
<div class="sw"><span class="chip" style="background:#1b4436"></span><span class="col" style="gap:2px"><span class="nm">--felt-600</span><span class="hx">#1b4436 raised</span></span></div>
<div class="sw"><span class="chip" style="background:#081a14"></span><span class="col" style="gap:2px"><span class="nm">--well-900</span><span class="hx">#081a14 socket</span></span></div>
</div></body></html>
