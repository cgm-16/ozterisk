<!-- @dsCard group="Colors" viewport="700x150" name="Ink & hairlines" subtitle="Transparency is used only for ink and borders — never for panels." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ink</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 150px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row">
<div class="sw"><span class="chip" style="background:#f7f0e2"></span><span class="col" style="gap:2px"><span class="nm">--text-primary</span><span class="hx">#f7f0e2</span></span></div>
<div class="sw"><span class="chip" style="background:rgba(240,231,214,.72)"></span><span class="col" style="gap:2px"><span class="nm">--text-body</span><span class="hx">ink 72%</span></span></div>
<div class="sw"><span class="chip" style="background:rgba(240,231,214,.55)"></span><span class="col" style="gap:2px"><span class="nm">--text-meta</span><span class="hx">ink 55%</span></span></div>
<div class="sw"><span class="chip" style="background:rgba(240,231,214,.40)"></span><span class="col" style="gap:2px"><span class="nm">--text-disabled</span><span class="hx">ink 40%</span></span></div>
<div class="sw"><span class="chip" style="background:rgba(240,231,214,.10)"></span><span class="col" style="gap:2px"><span class="nm">--border-hairline</span><span class="hx">ink 10%</span></span></div>
</div></body></html>
