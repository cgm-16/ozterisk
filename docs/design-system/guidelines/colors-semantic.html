<!-- @dsCard group="Colors" viewport="700x150" name="Semantic states" subtitle="Gold brand, jade correct, vermilion incorrect. Only at the moment of the event." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Semantic</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 150px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row">
<div class="sw"><span class="chip" style="background:#c9a54a"></span><span class="col" style="gap:2px"><span class="nm">--accent</span><span class="hx">#c9a54a gold / streak</span></span></div>
<div class="sw"><span class="chip" style="background:#e8cd85"></span><span class="col" style="gap:2px"><span class="nm">--accent-hover</span><span class="hx">#e8cd85 hover</span></span></div>
<div class="sw"><span class="chip" style="background:#4f9d7c"></span><span class="col" style="gap:2px"><span class="nm">--state-correct</span><span class="hx">#4f9d7c jade</span></span></div>
<div class="sw"><span class="chip" style="background:#b5432f"></span><span class="col" style="gap:2px"><span class="nm">--state-incorrect</span><span class="hx">#b5432f vermilion</span></span></div>
</div></body></html>
