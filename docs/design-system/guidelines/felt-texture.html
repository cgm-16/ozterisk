<!-- @dsCard group="Colors" viewport="700x170" name="Felt surface" subtitle="Flat felt + a 48° weave stripe at 2.2% white. One gold radial allowed per page." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Felt</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 170px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row" style="gap:14px">
  <div class="col"><span class="cap">felt + weave</span><span style="width:200px;height:96px;border-radius:var(--radius-lg);background:var(--surface-table);background-image:repeating-linear-gradient(48deg,rgba(255,255,255,.022) 0 2px,transparent 2px 4px);border:1px solid var(--border-hairline)"></span></div>
  <div class="col"><span class="cap">panel on felt</span><span style="width:200px;height:96px;border-radius:var(--radius-lg);background:var(--surface-panel);border:1px solid var(--border-accent)"></span></div>
  <div class="col"><span class="cap">page radial (10% gold)</span><span style="width:200px;height:96px;border-radius:var(--radius-lg);background:var(--surface-surround);background-image:radial-gradient(ellipse 220px 130px at 20% -10%,rgba(201,165,74,.10),transparent 70%);border:1px solid var(--border-hairline)"></span></div>
</div></body></html>
