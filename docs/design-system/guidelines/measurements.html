<!-- @dsCard group="Spacing" viewport="700x180" name="Rack measurements" subtitle="The constraint, in pixels. 44px is both the a11y minimum and the smallest legal tile." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Measurements</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 180px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="grid" style="gap:7px">
<div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--tile-w / --tile-h</span><span class="nm" style="color:var(--accent);width:10ch">64px × 80px</span><span class="hx">rack and answer-slot tile</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--tile-w-sm / --tile-h-sm</span><span class="nm" style="color:var(--accent);width:10ch">30px × 38px</span><span class="hx">compact tile</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--rack-gap</span><span class="nm" style="color:var(--accent);width:10ch">12px</span><span class="hx">between sockets</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--rack-columns × --rack-rows</span><span class="nm" style="color:var(--accent);width:10ch">5 × 2</span><span class="hx">never reflows</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--capacity</span><span class="nm" style="color:var(--accent);width:10ch">10</span><span class="hx">the whole game</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--target-min</span><span class="nm" style="color:var(--accent);width:10ch">44px</span><span class="hx">a11y minimum & smallest tile</span></div><div class="row" style="gap:12px;align-items:baseline"><span class="nm" style="width:24ch">--arena-max-width</span><span class="nm" style="color:var(--accent);width:10ch">42rem</span><span class="hx">one centred column</span></div>
</div></body></html>
