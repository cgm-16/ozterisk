<!-- @dsCard group="Brand" viewport="700x290" name="The rack" subtitle="Ten sockets in 5×2, always. The grid never resizes — empty sockets are the score." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rack</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 290px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
  .tile { width: var(--tile-w); height: var(--tile-h); border-radius: var(--radius-md); background: var(--surface-tile); color: var(--text-on-tile); font: var(--weight-semibold) var(--size-tile)/1 var(--font-numeral); text-shadow: 0 1px 0 rgba(255,255,255,.85); box-shadow: var(--shadow-tile); display: flex; align-items: center; justify-content: center; }
  .well { width: var(--tile-w); height: var(--tile-h); border-radius: var(--radius-md); background: var(--surface-socket); box-shadow: var(--shadow-socket), var(--rim-socket); }

</style></head><body><div class="col">
  <span class="cap">8 of 10 held · two sockets dead for the rest of the run</span>
  <div style="display:grid;grid-template-columns:repeat(5,var(--tile-w));gap:var(--rack-gap);padding:var(--space-4);border-radius:var(--radius-lg);background:var(--surface-panel);border:1px solid var(--border-hairline);width:max-content">
    <span class="tile">1</span><span class="tile">2</span><span class="tile">3</span><span class="well"></span><span class="tile">5</span>
    <span class="tile">6</span><span class="tile">7</span><span class="well"></span><span class="tile">9</span><span class="tile">0</span>
  </div>
</div></body></html>
