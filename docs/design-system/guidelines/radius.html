<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Five steps. Compact tile 5, tile & button 8, panel 12, frame 14." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 170px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row" style="gap:18px">
<div class="col"><span class="cap">--radius-sm</span><span style="width:72px;height:60px;border-radius:5px;background:var(--surface-raised);border:1px solid var(--border-hairline)"></span><span class="hx">5px</span></div><div class="col"><span class="cap">--radius-md</span><span style="width:72px;height:60px;border-radius:8px;background:var(--surface-raised);border:1px solid var(--border-hairline)"></span><span class="hx">8px</span></div><div class="col"><span class="cap">--radius-lg</span><span style="width:72px;height:60px;border-radius:12px;background:var(--surface-raised);border:1px solid var(--border-hairline)"></span><span class="hx">12px</span></div><div class="col"><span class="cap">--radius-xl</span><span style="width:72px;height:60px;border-radius:14px;background:var(--surface-raised);border:1px solid var(--border-hairline)"></span><span class="hx">14px</span></div>
<div class="col"><span class="cap">--radius-pill</span><span style="width:96px;height:34px;border-radius:999px;border:1px solid var(--border-accent)"></span><span class="hx">999px · chips only</span></div>
</div></body></html>
