<!-- @dsCard group="Brand" viewport="700x200" name="Socket & slot" subtitle="Recessed: inset only, never an outer shadow. Dashed rim = awaiting input." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sockets</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 200px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
  .well { width: var(--tile-w); height: var(--tile-h); border-radius: var(--radius-md); background: var(--surface-socket); box-shadow: var(--shadow-socket); }

</style></head><body><div class="row" style="gap:20px">
  <div class="col"><span class="cap">empty socket (rack)</span><span class="well" style="box-shadow:var(--shadow-socket),var(--rim-socket)"></span></div>
  <div class="col"><span class="cap">empty answer slot</span><span class="well" style="border:1px dashed var(--border-slot-empty)"></span></div>
  <div class="col"><span class="cap">compact well</span><span class="well" style="width:var(--tile-w-sm);height:var(--tile-h-sm);border-radius:var(--radius-sm);box-shadow:var(--shadow-socket-sm),var(--rim-socket);border:1px dashed var(--border-slot-empty)"></span></div>
  <div class="col" style="max-width:30ch"><span class="cap">rule</span><span class="hx" style="line-height:1.5">Dashed is the system's only dashed border. It means "something belongs here and does not yet."</span></div>
</div></body></html>
