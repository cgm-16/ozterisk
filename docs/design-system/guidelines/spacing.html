<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="Inherited from the app's global.css; 40 and 56 added for felt layouts." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 200px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="grid" style="gap:8px">
<div class="row" style="gap:12px;align-items:center"><span style="width:4px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-1</span><span class="hx">4px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:8px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-2</span><span class="hx">8px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:12px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-3</span><span class="hx">12px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:16px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-4</span><span class="hx">16px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:24px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-6</span><span class="hx">24px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:32px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-8</span><span class="hx">32px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:40px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-10</span><span class="hx">40px</span></div><div class="row" style="gap:12px;align-items:center"><span style="width:56px;height:9px;border-radius:2px;background:var(--accent);flex:none"></span><span class="nm">--space-14</span><span class="hx">56px</span></div>
</div></body></html>
