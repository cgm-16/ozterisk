<!-- @dsCard group="Brand" viewport="700x200" name="Interaction states" subtitle="Hover raises, press depresses, disabled goes flat. Never opacity for hover." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>States</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 200px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="row" style="gap:16px;align-items:flex-start">
<div class="col"><span class="cap">default</span><span style="min-height:44px;padding:0 26px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--state-incorrect);color:var(--ink-000);box-shadow:0 4px 0 #7d2d1f;transform:translateY(0);font:var(--weight-bold) 11px/1 var(--font-ui);letter-spacing:var(--track-label);text-transform:uppercase;">Submit</span></div><div class="col"><span class="cap">pressed</span><span style="min-height:44px;padding:0 26px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--state-incorrect);color:var(--ink-000);box-shadow:0 2px 0 #7d2d1f;transform:translateY(2px);font:var(--weight-bold) 11px/1 var(--font-ui);letter-spacing:var(--track-label);text-transform:uppercase;">Submit</span></div><div class="col"><span class="cap">disabled</span><span style="min-height:44px;padding:0 26px;display:flex;align-items:center;border-radius:var(--radius-md);background:transparent;color:var(--text-disabled);box-shadow:none;transform:translateY(0);font:var(--weight-bold) 11px/1 var(--font-ui);letter-spacing:var(--track-label);text-transform:uppercase;outline:1px solid var(--border-hairline)">Submit</span></div>
<div class="col"><span class="cap">focus</span><span style="min-height:44px;padding:0 26px;display:flex;align-items:center;border-radius:var(--radius-md);background:var(--surface-raised);color:var(--ink-000);outline:2px solid var(--focus-ring);outline-offset:2px;font:var(--weight-bold) 11px/1 var(--font-ui);letter-spacing:var(--track-label);text-transform:uppercase">Clear</span></div>
<div class="col" style="max-width:26ch"><span class="cap">rule</span><span class="hx" style="line-height:1.5">A disabled button is flat against the felt — "not yet" reads as "not raised".</span></div>
</div></body></html>
