<!-- @dsCard group="Brand" viewport="700x210" name="Streak ladder" subtitle="Tiers at 3, 5, 8. Layers accumulate, never swap. Nothing above 8 escalates." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Streak</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 210px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .ring { position:absolute; border-radius:50%; width:88px; height:88px; }
</style></head><body><div class="row" style="gap:34px">
<div class="col" style="align-items:center;gap:9px">
  <span class="cap">tier 3</span>
  <span style="position:relative;display:flex;align-items:center;justify-content:center;width:104px;height:104px">
    <span class="ring" style="border:2px solid var(--state-correct)"></span>
    
    
    <span style="position:relative;font:var(--weight-semibold) 30px/1 var(--font-display);color:var(--text-primary)">42</span>
  </span>
  <span class="hx" style="max-width:22ch;text-align:center">bloom + one jade ring</span>
</div><div class="col" style="align-items:center;gap:9px">
  <span class="cap">tier 5</span>
  <span style="position:relative;display:flex;align-items:center;justify-content:center;width:104px;height:104px">
    <span class="ring" style="border:2px solid var(--state-correct)"></span>
    <span class="ring" style="border:1px solid rgba(201,165,74,.75);width:100px;height:100px"></span>
    
    <span style="position:relative;font:var(--weight-semibold) 30px/1 var(--font-display);color:var(--text-primary)">42</span>
  </span>
  <span class="hx" style="max-width:22ch;text-align:center">+ second gold ring, gold rim</span>
</div><div class="col" style="align-items:center;gap:9px">
  <span class="cap">tier 8</span>
  <span style="position:relative;display:flex;align-items:center;justify-content:center;width:104px;height:104px">
    <span class="ring" style="border:2px solid var(--state-correct)"></span>
    <span class="ring" style="border:1px solid rgba(201,165,74,.75);width:100px;height:100px"></span>
    <span class="ring" style="border:1px solid rgba(240,231,214,.45);width:112px;height:112px"></span>
    <span style="position:relative;font:var(--weight-semibold) 30px/1 var(--font-display);color:var(--text-primary)">42</span>
  </span>
  <span class="hx" style="max-width:22ch;text-align:center">+ third ring, six-chip burst</span>
</div>
</div></body></html>
