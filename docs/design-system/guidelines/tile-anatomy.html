<!-- @dsCard group="Brand" viewport="700x210" name="Tile anatomy" subtitle="Hard ceramic edge plus soft contact shadow. Never a blurred all-round shadow." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Tile anatomy</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 210px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
  .tile { width: var(--tile-w); height: var(--tile-h); border-radius: var(--radius-md); background: var(--surface-tile); color: var(--text-on-tile); font: var(--weight-semibold) var(--size-tile)/1 var(--font-numeral); text-shadow: 0 1px 0 rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; }

</style></head><body><div class="row" style="gap:20px">
  <div class="col"><span class="cap">resting</span><span class="tile" style="box-shadow:var(--shadow-tile)">7</span></div>
  <div class="col"><span class="cap">lifted</span><span class="tile" style="box-shadow:var(--shadow-tile-lifted);transform:translateY(-5px)">4</span></div>
  <div class="col"><span class="cap">pressed</span><span class="tile" style="box-shadow:var(--shadow-tile-pressed);transform:translateY(2px)">2</span></div>
  <div class="col"><span class="cap">reward</span><span class="tile" style="box-shadow:var(--shadow-tile),var(--glow-reward);outline:1px solid var(--accent);outline-offset:-1px">8</span></div>
  <div class="col"><span class="cap">marked</span><span class="tile" style="box-shadow:var(--shadow-tile-lifted),0 0 0 2px var(--state-discard);transform:translateY(-5px) rotate(6deg)">9</span></div>
</div></body></html>
