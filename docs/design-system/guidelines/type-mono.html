<!-- @dsCard group="Type" viewport="700x180" name="Labels — IBM Plex Mono" subtitle="The only tracked type in the system. Always uppercase, 9–11px." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mono type</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 180px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="grid">
  <span style="font:var(--weight-medium) 11px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--text-meta)">capacity 9 / 10</span>
  <span style="font:var(--weight-medium) 11px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)">streak 8</span>
  <span style="font:var(--weight-medium) 9px/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--text-meta)">rounds played · longest streak</span>
  <span class="hx">--track-label 0.2em / --track-label-tight 0.14em</span>
</div></body></html>
