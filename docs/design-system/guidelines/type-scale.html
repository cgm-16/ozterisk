<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Eight sizes. Nothing interactive below 11px." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Scale</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 230px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="grid" style="gap:7px">
  <span style="font:var(--weight-medium) 34px/1 var(--font-display);color:var(--text-primary)">34 <span class="hx">--size-display / --size-tile</span></span>
  <span style="font:var(--weight-medium) 24px/1 var(--font-display);color:var(--text-primary)">24 <span class="hx">--size-title</span></span>
  <span style="font:var(--weight-regular) 16px/1 var(--font-display);color:var(--text-body)">16 <span class="hx">--size-body</span></span>
  <span style="font:var(--weight-regular) 13.5px/1 var(--font-ui);color:var(--text-body)">13.5 <span class="hx">--size-body-sm</span></span>
  <span style="font:var(--weight-medium) 11px/1 var(--font-mono);letter-spacing:.14em;color:var(--text-meta)">11 &nbsp;<span class="hx">--size-label</span></span>
  <span style="font:var(--weight-medium) 9px/1 var(--font-mono);letter-spacing:.14em;color:var(--text-meta)">9 &nbsp;<span class="hx">--size-micro</span></span>
</div></body></html>
