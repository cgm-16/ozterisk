<!-- @dsCard group="Type" viewport="700x190" name="Interface — Zen Kaku Gothic New + Noto Sans KR" subtitle="Latin from Zen Kaku, Hangul from Noto. Two faces, one stack, matched size." -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>UI type</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-table); background-image: repeating-linear-gradient(48deg, rgba(255,255,255,.022) 0 2px, transparent 2px 4px); padding: 18px 20px; height: 190px; overflow: hidden; }
  .grid { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .sw { display: flex; align-items: center; gap: 9px; }
  .chip { width: 34px; height: 34px; border-radius: var(--radius-sm); flex: none; }
  .nm { font: var(--weight-medium) 10px/1.35 var(--font-mono); color: var(--text-primary); }
  .hx { font: var(--weight-regular) 9px/1.35 var(--font-mono); color: var(--text-meta); }
  .cap { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--text-meta); }
  .col { display: flex; flex-direction: column; gap: 6px; }
  
</style></head><body><div class="grid">
  <span class="cap">--font-ui · --size-body-sm 13.5px</span>
  <span style="font:var(--weight-regular) 13.5px/1.4 var(--font-ui);color:var(--text-body);max-width:62ch">Click or tap an inventory tile to place it in the next empty answer slot.</span>
  <span style="font:var(--weight-regular) 13.5px/1.4 var(--font-ui);color:var(--text-body);max-width:62ch">인벤토리 타일을 클릭하거나 탭하면 다음 빈 정답 칸에 놓입니다.</span>
  <span class="hx">Zen Kaku sets the Latin; Hangul falls per-glyph to Noto Sans KR — the order in --font-ui is load-bearing</span>
</div></body></html>
