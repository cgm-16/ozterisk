<!-- @dsCard group="Game" viewport="900x760" -->
<!-- @startingPoint section="Game" subtitle="Full ozterisk run — title through game over" viewport="900x760" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ozterisk — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body {
    background: var(--surface-surround);
    background-image: radial-gradient(ellipse 900px 520px at 22% -8%, rgba(201,165,74,.10), transparent 70%);
    min-height: 100svh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-8) var(--space-4);
  }
  #root { width: 100%; max-width: 900px; }
</style>
</head>
<body>
<div id="root"><div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:56px 32px;text-align:center"><span style="width:64px;height:80px;border-radius:8px;background:linear-gradient(160deg,#fdf8ec,#e6d7ba);box-shadow:0 5px 0 #b3a184,0 10px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:600 34px/1 'EB Garamond',serif;color:#16352b">&#10035;</span><span style="font:500 52px/1 'EB Garamond',serif;letter-spacing:.02em;color:#f7f0e2">oz<span style="color:#c9a54a">&#10035;</span>terisk</span></div></div>

<script>
/* Loads the design system's component sources as globals so this kit composes
   the real primitives instead of re-implementing them. */
const FILES = [
  "../../components/game/Tile.jsx",
  "../../components/game/TileInventory.jsx",
  "../../components/game/AnswerSlots.jsx",
  "../../components/game/EquationBoard.jsx",
  "../../components/hud/ActionButton.jsx",
  "../../components/hud/CapacityMeter.jsx",
  "../../components/hud/GameHud.jsx",
  "../../components/hud/LanguageToggle.jsx",
  "../../components/flow/FeedbackPanel.jsx",
  "../../components/flow/OverflowControls.jsx",
  "../../components/flow/TitleScreen.jsx",
  "../../components/flow/GameOverScreen.jsx",
];

window.DS = {};

const stripImports = (s) => s.split("\n").filter((l) => !/^\s*import\b/.test(l)).join("\n");

async function boot() {
  for (const url of FILES) {
    const src = await fetch(url).then((r) => r.text());
    const stripped = stripImports(src).replace(/\bexport\s+function\b/g, "function");
    const names = [...src.matchAll(/export function (\w+)/g)].map((m) => m[1]);
    const code = Babel.transform(
      stripped + "\n" + names.map((n) => `window.DS.${n} = ${n};`).join("\n"),
      { presets: [["react", { runtime: "classic" }]] }
    ).code;
    try {
      new Function("React", "Tile", "ActionButton", "LanguageToggle", "GameHud", "CapacityMeter", "EquationBoard", "AnswerSlots", "TileInventory", "FeedbackPanel", "OverflowControls", code)(
      window.React,
      window.DS.Tile, window.DS.ActionButton, window.DS.LanguageToggle, window.DS.GameHud,
      window.DS.CapacityMeter, window.DS.EquationBoard, window.DS.AnswerSlots,
      window.DS.TileInventory, window.DS.FeedbackPanel, window.DS.OverflowControls
      );
    } catch (e) {
      console.error("failed:", url, e.message, code.slice(0, 200));
      throw e;
    }
  }
  const appSrc = await fetch("./App.jsx").then((r) => r.text());
  const msgSrc = await fetch("./messages.js").then((r) => r.text());
  const msg = Babel.transform(stripImports(msgSrc).replace(/\bexport\s+(const|function)\b/g, "$1"), { presets: [["react", { runtime: "classic" }]] }).code;
  const app = Babel.transform(stripImports(appSrc).replace(/\bexport\s+function\b/g, "function"), { presets: [["react", { runtime: "classic" }]] }).code;
  new Function("React", "DS", msg + "\n" + app + "\nwindow.__App = App;")(window.React, window.DS);
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__App));
}
boot();
</script>
</body>
</html>
