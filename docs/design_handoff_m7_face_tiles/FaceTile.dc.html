<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<script src="_ds/ozterisk-tile-house-00730619-c785-40b7-b910-cbfb94586b30/_ds_bundle.js"></script>
</helmet>
<div role="img" aria-label="{{ aria }}" style="position:relative;width:{{ w }};height:{{ h }};border-radius:{{ r }}px;outline:{{ outline }};outline-offset:-1px;background:{{ bg }};box-shadow:{{ shadow }};transform:{{ transform }};opacity:{{ opacity }};transition:transform var(--dur-select) var(--ease-settle), box-shadow var(--dur-select) var(--ease-settle);display:flex;align-items:center;justify-content:center;color:{{ ink }};font-family:var(--font-display);flex:none;overflow:hidden">
  <div style="position:absolute;inset:{{ inset }}px;border:1px solid {{ inlay }};border-radius:{{ ir }}px;pointer-events:none"></div>
  <span style="font-size:{{ fs }}px;line-height:1;font-weight:{{ fw }};color:{{ glyphInk }}">{{ glyph }}</span>
  <sc-if value="{{ cracked }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:18%;top:-4%;width:1.5px;height:108%;background:var(--clay-900);opacity:.55;transform:rotate(18deg);transform-origin:top"></div>
    <div style="position:absolute;left:46%;top:44%;width:1px;height:38%;background:var(--clay-900);opacity:.45;transform:rotate(-34deg);transform-origin:top"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;wild&quot;,&quot;odd&quot;,&quot;even&quot;,&quot;low&quot;,&quot;high&quot;,&quot;nbr&quot;],&quot;default&quot;:&quot;odd&quot;,&quot;tsType&quot;:&quot;'wild'|'odd'|'even'|'low'|'high'|'nbr'&quot;},&quot;centre&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:8,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lg&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;lg&quot;,&quot;tsType&quot;:&quot;'lg'|'sm'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;resting&quot;,&quot;lifted&quot;,&quot;reward&quot;,&quot;marked&quot;,&quot;disabled&quot;,&quot;bloom&quot;,&quot;crack&quot;],&quot;default&quot;:&quot;resting&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'odd';
    const c = Math.min(8, Math.max(1, this.props.centre ?? 5));
    const sm = (this.props.size ?? 'lg') === 'sm';
    const state = this.props.state ?? 'resting';
    const F = {
      wild: { g: '✳', t: 'wild', aria: 'Wildcard: any digit' },
      odd: { g: 'O', t: 'letter', aria: 'Odd tile: 1, 3, 5, 7, or 9' },
      even: { g: 'E', t: 'letter', aria: 'Even tile: 0, 2, 4, 6, or 8' },
      low: { g: '0–4', t: 'range', aria: 'Digits 0 to 4' },
      high: { g: '5–9', t: 'range', aria: 'Digits 5 to 9' },
      nbr: { g: `${c - 1}–${c + 1}`, t: 'range', aria: `Digits ${c - 1} to ${c + 1}` },
    }[kind] || { g: '?', t: 'range', aria: '' };
    const fs = F.t === 'range' ? (sm ? 11 : 25) : (sm ? 18 : 36);
    const base = sm ? 'var(--shadow-tile-sm)' : 'var(--shadow-tile)';
    const lifted = sm ? '0 5px 0 var(--clay-400)' : 'var(--shadow-tile-lifted)';
    const S = {
      resting: { shadow: base, transform: 'none' },
      lifted: { shadow: lifted, transform: 'translateY(calc(-1 * var(--lift-offset)))' },
      reward: { shadow: `${base}, var(--glow-reward)`, transform: 'none', outline: '1px solid var(--accent)' },
      marked: { shadow: `${lifted}, 0 0 0 2px var(--verm-600)`, transform: 'translateY(calc(-1 * var(--lift-offset))) rotate(6deg)' },
      disabled: { shadow: 'none', transform: 'none' },
      bloom: { shadow: `${lifted}, 0 0 0 2px var(--jade-500)`, transform: 'translateY(-14px)' },
      crack: { shadow: `${base}, 0 0 0 2px var(--verm-600)`, transform: 'rotate(-3deg)' },
    }[state] || { shadow: base, transform: 'none' };
    const off = state === 'disabled';
    return {
      aria: this.props.label ?? F.aria,
      r: sm ? 5 : 8, inset: sm ? 3 : 5, ir: sm ? 3 : 4,
      bg: 'var(--surface-tile)',
      opacity: off ? 0.45 : 1,
      outline: S.outline || 'none',
      w: sm ? '30px' : 'var(--tile-w, 64px)', h: sm ? '38px' : 'var(--tile-h, 80px)',
      shadow: S.shadow, transform: S.transform,
      inlay: 'var(--gold-700)',
      ink: 'var(--clay-900)',
      glyphInk: F.t === 'wild' ? 'var(--gold-500)' : 'var(--clay-900)',
      glyph: F.g, fs, fw: sm && F.t === 'range' ? 600 : 500,
      cracked: state === 'crack',
    };
  }
}
</script>
</body>
</html>
