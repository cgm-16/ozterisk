<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="ct cd">
<title id="ct">Market economy: a standing row clogs, a free row does not</title>
<desc id="cd">Two panels over submission number, k = 3 open orders, kind bias off, 4,000 bot runs each. Left: the share of open orders the hand can spell falls from 0.70 to about 0.22 in the standing row, but holds near 0.46 in the free row. Right: tiles gained per submission fall below zero by submission 10 in the standing row, like Endless, while the free row stays near +0.45, so its runs stop ending.</desc>
<rect width="800" height="500" rx="14" fill="#14342a"/>
<text x="28" y="40" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f7f0e2">A standing row clogs; a free row never does</text>
<text x="28" y="62" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f7f0e2" fill-opacity="0.72">k = 3 open orders, kind bias off · Endless at its shipped kind 0.2 · 4,000 bot runs each · market-sim.ts chart</text>
<line x1="28" y1="88" x2="50" y2="88" stroke="#1fa384" stroke-width="2"/>
<text x="58" y="92" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f7f0e2" fill-opacity="0.9">Standing row: unchosen orders stay</text>
<line x1="301.6" y1="88" x2="323.6" y2="88" stroke="#e06048" stroke-width="2"/>
<text x="331.6" y="92" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f7f0e2" fill-opacity="0.9">Free row: unchosen orders vanish</text>
