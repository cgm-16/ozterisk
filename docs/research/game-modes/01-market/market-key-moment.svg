<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" width="390" height="760" role="img" aria-labelledby="t d">
  <title id="t">Market: three open orders, one five in hand</title>
  <desc id="d">A phone in the answering phase. Three equations lie open in a row: 7 × 8, 6 × 9 and 9 × 3. 7 × 8 is active, raised with a gold outline, and its first answer slot holds the hand's only 5, so 6 × 9, which also needs a 5, must wait. 9 × 3 needs a 7 the hand does not hold and stays open until it is answered. Below, the ten-socket rack holds 1 2 2 3 4, an on-loan socket, 6 6 8 9.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/>
      <stop offset="1" stop-color="#e6d7ba"/>
    </linearGradient>
    <symbol id="tile" viewBox="0 0 52 64">
      <rect x="0" y="0" width="52" height="64" rx="6" fill="#b3a184"/>
      <rect x="0" y="0" width="52" height="59" rx="6" fill="url(#face)"/>
    </symbol>
    <symbol id="slotTile" viewBox="0 0 64 80">
      <rect x="0" y="0" width="64" height="80" rx="7" fill="#b3a184"/>
      <rect x="0" y="0" width="64" height="74" rx="7" fill="url(#face)"/>
    </symbol>
  </defs>

  <!-- surround and phone -->
  <rect width="390" height="760" fill="#071711"/>
  <rect x="8" y="8" width="374" height="604" rx="28" fill="#14342a"/>

  <!-- HUD: round carries primary emphasis -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" fill="#f7f0e2">
    <text x="40" y="44" font-size="11" letter-spacing="1.6" fill-opacity="0.72">ROUND</text>
    <text x="40" y="76" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="32" font-weight="600">14</text>
    <text x="160" y="44" font-size="11" letter-spacing="1.6" fill-opacity="0.55">SCORE</text>
    <text x="160" y="72" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="22">11</text>
    <text x="262" y="44" font-size="11" letter-spacing="1.6" fill-opacity="0.55">STREAK</text>
    <text x="262" y="72" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="22">2</text>
  </g>
  <!-- capacity meter, Endless's: ten pips, ten held -->
  <g fill="#c9a54a">
    <circle cx="44" cy="96" r="3.5"/><circle cx="56" cy="96" r="3.5"/><circle cx="68" cy="96" r="3.5"/><circle cx="80" cy="96" r="3.5"/><circle cx="92" cy="96" r="3.5"/>
    <circle cx="104" cy="96" r="3.5"/><circle cx="116" cy="96" r="3.5"/><circle cx="128" cy="96" r="3.5"/><circle cx="140" cy="96" r="3.5"/><circle cx="152" cy="96" r="3.5"/>
  </g>

  <!-- the open row: three orders -->
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" text-anchor="middle">
    <!-- 7 x 8, active: raised, gold rule -->
    <rect x="21" y="122" width="108" height="92" rx="9" fill="#071711" fill-opacity="0.45"/>
    <rect x="21" y="116" width="108" height="92" rx="9" fill="#1b4436" stroke="#c9a54a" stroke-width="1.5"/>
    <text x="75" y="160" font-size="30" font-weight="600" fill="#f7f0e2">7 × 8</text>
    <rect x="58" y="176" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-dasharray="3 2"/>
    <rect x="78" y="176" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-dasharray="3 2"/>
    <!-- 6 x 9 -->
    <rect x="141" y="122" width="108" height="92" rx="9" fill="#1b4436"/>
    <text x="195" y="166" font-size="30" font-weight="600" fill="#f7f0e2" fill-opacity="0.9">6 × 9</text>
    <rect x="178" y="182" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <rect x="198" y="182" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <!-- 9 x 3, waiting -->
    <rect x="261" y="122" width="108" height="92" rx="9" fill="#1b4436"/>
    <text x="315" y="166" font-size="30" font-weight="600" fill="#f7f0e2" fill-opacity="0.9">9 × 3</text>
    <rect x="298" y="182" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-opacity="0.6" stroke-dasharray="3 2"/>
    <rect x="318" y="182" width="14" height="18" rx="2" fill="none" stroke="#c9a54a" stroke-opacity="0.6" stroke-dasharray="3 2"/>
  </g>

  <!-- answer slots for the active order -->
  <use href="#slotTile" x="125" y="244" width="64" height="80"/>
  <text x="157" y="296" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="40" font-weight="500" fill="#16352b">5</text>
  <rect x="201.5" y="244.5" width="63" height="79" rx="7" fill="none" stroke="#c9a54a" stroke-dasharray="5 4"/>

  <!-- actions: Submit is flat (disabled), Clear is raised -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2" text-anchor="middle">
    <rect x="71.5" y="348.5" width="118" height="43" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.25"/>
    <text x="130.5" y="375" fill="#f7f0e2" fill-opacity="0.4">SUBMIT</text>
    <rect x="200.5" y="346.5" width="118" height="43" rx="8" fill="#1b4436" stroke="#f7f0e2" stroke-opacity="0.55"/>
    <text x="259.5" y="373" fill="#f7f0e2" fill-opacity="0.9">CLEAR</text>
  </g>

  <!-- the rack: ten sockets, 5 x 2; the 5 is on loan to the slot -->
  <rect x="39" y="420" width="312" height="160" rx="12" fill="#0b211b"/>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-weight="500" fill="#16352b" text-anchor="middle">
    <use href="#tile" x="49" y="430" width="52" height="64"/><text x="75" y="472">1</text>
    <use href="#tile" x="109" y="430" width="52" height="64"/><text x="135" y="472">2</text>
    <use href="#tile" x="169" y="430" width="52" height="64"/><text x="195" y="472">2</text>
    <use href="#tile" x="229" y="430" width="52" height="64"/><text x="255" y="472">3</text>
    <use href="#tile" x="289" y="430" width="52" height="64"/><text x="315" y="472">4</text>
    <rect x="49" y="506" width="52" height="64" rx="6" fill="#081a14"/>
    <rect x="49.5" y="506.5" width="51" height="63" rx="6" fill="none" stroke="#c9a54a" stroke-opacity="0.35" stroke-dasharray="3 3"/>
    <use href="#tile" x="109" y="506" width="52" height="64"/><text x="135" y="548">6</text>
    <use href="#tile" x="169" y="506" width="52" height="64"/><text x="195" y="548">6</text>
    <use href="#tile" x="229" y="506" width="52" height="64"/><text x="255" y="548">8</text>
    <use href="#tile" x="289" y="506" width="52" height="64"/><text x="315" y="548">9</text>
  </g>

  <!-- annotation, outside the phone -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#f7f0e2">
    <text x="20" y="646" fill="#e8cd85" font-size="11" letter-spacing="1.6">THE DECISION</text>
    <text x="20" y="670">7 × 8 and 6 × 9 both need the only 5.</text>
    <text x="20" y="690" fill-opacity="0.72">Answer one; the other stays where it is.</text>
    <text x="20" y="716">9 × 3 needs a 7 you do not hold.</text>
    <text x="20" y="736" fill-opacity="0.72">An order leaves only when it is answered, right or wrong.</text>
  </g>
</svg>
