<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 826" width="390" height="826" role="img" aria-labelledby="title desc">
  <title id="title">Factor: two right answers in hand</title>
  <desc id="desc">Phone mockup. The board reads empty slot times empty slot equals 24. The rack holds 2 3 4 5 6 on the top row and 6 7 8 9 plus one empty socket below. Both 3 × 8 and 4 × 6 are in hand. A caption below the phone compares them: 4 × 6 spends the spare 6 and keeps 25 of 45 facts answerable; 3 × 8 keeps 20.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/>
      <stop offset="1" stop-color="#e6d7ba"/>
    </linearGradient>
    <!-- a 52 x 64 ceramic tile with its 5px bottom thickness -->
    <g id="tile">
      <rect y="5" width="52" height="64" rx="6" fill="#b3a184"/>
      <rect width="52" height="64" rx="6" fill="url(#face)"/>
    </g>
    <g id="mini">
      <rect y="3" width="30" height="38" rx="4" fill="#b3a184"/>
      <rect width="30" height="38" rx="4" fill="url(#face)"/>
    </g>
  </defs>

  <rect width="390" height="826" fill="#071711"/>
  <rect x="12" y="12" width="366" height="636" rx="28" fill="#14342a"/>

  <!-- HUD: round carries the primary emphasis -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#f7f0e2" fill-opacity="0.55" text-anchor="middle">
    <text x="95" y="50">ROUND</text>
    <text x="195" y="50">SCORE</text>
    <text x="295" y="50">STREAK</text>
  </g>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#f7f0e2">
    <text x="95" y="86" font-size="34">5</text>
    <text x="195" y="84" font-size="26" fill-opacity="0.72">3</text>
    <text x="295" y="84" font-size="26" fill-opacity="0.72">1</text>
  </g>
  <!-- capacity meter: 9 held of 10 -->
  <g fill="#c9a54a">
    <rect x="113" y="104" width="12" height="6" rx="3"/>
    <rect x="129" y="104" width="12" height="6" rx="3"/>
    <rect x="145" y="104" width="12" height="6" rx="3"/>
    <rect x="161" y="104" width="12" height="6" rx="3"/>
    <rect x="177" y="104" width="12" height="6" rx="3"/>
    <rect x="193" y="104" width="12" height="6" rx="3"/>
    <rect x="209" y="104" width="12" height="6" rx="3"/>
    <rect x="225" y="104" width="12" height="6" rx="3"/>
    <rect x="241" y="104" width="12" height="6" rx="3"/>
    <rect x="257.5" y="104.5" width="11" height="5" rx="2.5" fill="none" stroke="#c9a54a" stroke-opacity="0.6"/>
  </g>

  <!-- the board: product shown, factors asked -->
  <g fill="none" stroke="#c9a54a" stroke-width="1.2" stroke-dasharray="5 4">
    <rect x="44" y="148" width="64" height="80" rx="6"/>
    <rect x="150" y="148" width="64" height="80" rx="6"/>
  </g>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" fill="#f7f0e2" text-anchor="middle">
    <text x="129" y="202" font-size="36" fill-opacity="0.72">×</text>
    <text x="236" y="202" font-size="36" fill-opacity="0.72">=</text>
    <text x="300" y="208" font-size="58">24</text>
  </g>

  <!-- actions, disabled until both slots are filled -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2" text-anchor="middle" fill="#f7f0e2" fill-opacity="0.4">
    <rect x="75" y="268" width="112" height="44" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.25"/>
    <text x="131" y="295">SUBMIT</text>
    <rect x="203" y="268" width="112" height="44" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.25"/>
    <text x="259" y="295">CLEAR</text>
  </g>

  <!-- rack: ten felt-cut sockets, 5 x 2 -->
  <rect x="33" y="354" width="324" height="186" rx="12" fill="#0b211b"/>
  <g fill="#081a14">
    <rect x="49" y="370" width="52" height="69" rx="6"/>
    <rect x="109" y="370" width="52" height="69" rx="6"/>
    <rect x="169" y="370" width="52" height="69" rx="6"/>
    <rect x="229" y="370" width="52" height="69" rx="6"/>
    <rect x="289" y="370" width="52" height="69" rx="6"/>
    <rect x="49" y="455" width="52" height="69" rx="6"/>
    <rect x="109" y="455" width="52" height="69" rx="6"/>
    <rect x="169" y="455" width="52" height="69" rx="6"/>
    <rect x="229" y="455" width="52" height="69" rx="6"/>
    <rect x="289" y="455" width="52" height="69" rx="6" stroke="#1b4436"/>
  </g>
  <use href="#tile" x="49" y="370"/>
  <use href="#tile" x="109" y="370"/>
  <use href="#tile" x="169" y="370"/>
  <use href="#tile" x="229" y="370"/>
  <use href="#tile" x="289" y="370"/>
  <use href="#tile" x="49" y="455"/>
  <use href="#tile" x="109" y="455"/>
  <use href="#tile" x="169" y="455"/>
  <use href="#tile" x="229" y="455"/>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#16352b" text-anchor="middle">
    <text x="75" y="414">2</text>
    <text x="135" y="414">3</text>
    <text x="195" y="414">4</text>
    <text x="255" y="414">5</text>
    <text x="315" y="414">6</text>
    <text x="75" y="499">6</text>
    <text x="135" y="499">7</text>
    <text x="195" y="499">8</text>
    <text x="255" y="499">9</text>
  </g>

  <!-- annotation band, outside the phone: not UI -->
  <text x="24" y="684" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#c9a54a">TWO RIGHT ANSWERS IN HAND</text>
  <use href="#mini" x="24" y="700"/>
  <use href="#mini" x="58" y="700"/>
  <use href="#mini" x="24" y="748"/>
  <use href="#mini" x="58" y="748"/>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#16352b" text-anchor="middle">
    <text x="39" y="726">4</text>
    <text x="73" y="726">6</text>
    <text x="39" y="774">3</text>
    <text x="73" y="774">8</text>
  </g>
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" fill="#f7f0e2">
    <text x="102" y="715" font-size="13">4 × 6 spends the spare 6</text>
    <text x="102" y="732" font-size="12" fill-opacity="0.72">25 of 45 facts still answerable</text>
    <text x="102" y="763" font-size="13">3 × 8 spends your only 3 and 8</text>
    <text x="102" y="780" font-size="12" fill-opacity="0.72">20 of 45 facts still answerable</text>
    <text x="24" y="810" font-size="11" fill-opacity="0.55">Tiles are 1–9 only; the zero's socket starts empty.</text>
  </g>
</svg>
