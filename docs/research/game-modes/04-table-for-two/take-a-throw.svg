<title id="t">Table for Two: West takes East's thrown 7</title>
<desc id="d">Phone screen, West to play, round 9. East's rack sits small at the top; below it, on the felt, the 7 East just threw is outlined in gold and labelled Take. The equation is 9 times 8 with two empty answer slots. West's rack at the bottom holds 0 1 2 2 4 5 6 8 9 and one empty socket, and no 7. A dashed gold arrow runs from East's 7 down the right margin into West's empty socket. A note reads: taking costs one reward tile.</desc>
