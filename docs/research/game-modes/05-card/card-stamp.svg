<title id="t">Card mode: round 32 of 45, 7 × 8 just stamped</title>
<desc id="d">Phone mockup. The HUD band holds round 32 of 45, score 23 and streak 4 beside the times-table card: a lower-left triangle of 45 cells, one per fact, with 23 gold stamps, 9 cells crossed as missed and 13 still to come. The cell for 7 × 8 carries a fresh gold ring. Below, the equation 7 × 8 with answer tiles 5 and 6 in jade rings, the line Correct, Your answer: 56, a Next Round button, and a fixed fifteen-socket tray holding thirteen tiles, three of them new rewards outlined in gold.</desc>
