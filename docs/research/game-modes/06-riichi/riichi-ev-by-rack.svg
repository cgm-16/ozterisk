<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d">
<title id="t">Riichi pays only on a strong rack: net points per declaration against where rack states sit</title>
<desc id="d">Two panels sharing one x axis, q, the chance the next equation is buildable. Top: mean net points of a riichi declaration, with 95% intervals, rising from about minus 0.58 at q 0.2 to about plus 2.2 at q 1.0 and crossing zero between 0.45 and 0.50. Bottom: the share of eligible rack states in each q bin; 42% lie below 0.50. Simulation on the real reducer, 10,000 runs, skill 0.95, locked rack, stake 1.</desc>
