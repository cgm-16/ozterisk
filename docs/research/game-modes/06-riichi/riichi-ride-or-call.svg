<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" width="390" height="780" role="img" aria-labelledby="t d">
  <title id="t">Riichi: ride or call, at feedback after the third answer in riichi</title>
  <desc id="d">Phone mockup. The HUD reads Round 9, Points 8, Streak 3. A riichi stick lies on the table with the label Riichi, pot 6, next answer plus 4. The equation 7 times 8 was answered 5 6 and is correct. Two buttons: Tsumo, bank 7, and Next round, ride. On the rail above the rack, the newest reward tile, a 4, slides off on its own because a riichi rack is locked. The rack holds 0 1 2 3 3 5 7 8 9 9: no 4 and no 6.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/>
      <stop offset="1" stop-color="#e6d7ba"/>
    </linearGradient>
    <g id="tile">
      <rect x="0" y="5" width="52" height="64" rx="6" fill="#b3a184"/>
      <rect x="0" y="0" width="52" height="64" rx="6" fill="url(#face)"/>
    </g>
    <g id="bigtile">
      <rect x="0" y="5" width="64" height="80" rx="7" fill="#b3a184"/>
      <rect x="0" y="0" width="64" height="80" rx="7" fill="url(#face)"/>
    </g>
  </defs>

  <rect width="390" height="780" fill="#071711"/>
  <rect x="12" y="12" width="366" height="756" rx="28" fill="#14342a"/>

  <!-- HUD: points carries the primary emphasis in this mode -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="#f7f0e2" fill-opacity="0.55" text-anchor="middle">
    <text x="85" y="50">ROUND</text>
    <text x="195" y="50">POINTS</text>
    <text x="305" y="50">STREAK</text>
  </g>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" fill="#f7f0e2" text-anchor="middle">
    <text x="85" y="84" font-size="28" fill-opacity="0.72">9</text>
    <text x="195" y="88" font-size="38">8</text>
    <text x="305" y="84" font-size="28" fill-opacity="0.72">3</text>
  </g>

  <!-- the stick on the table: an object, not a felt reaction -->
  <rect x="40" y="108" width="310" height="54" rx="10" fill="#1b4436"/>
  <g transform="translate(60 129)">
    <rect x="0" y="1.5" width="104" height="12" rx="6" fill="#b3a184"/>
    <rect x="0" y="0" width="104" height="12" rx="6" fill="url(#face)"/>
    <circle cx="52" cy="6" r="3.6" fill="#b5432f"/>
  </g>
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif">
    <text x="182" y="131" font-size="11" letter-spacing="1.8" fill="#c9a54a">RIICHI · POT 6</text>
    <text x="182" y="149" font-size="12" fill="#f7f0e2" fill-opacity="0.72">next correct answer +4</text>
  </g>

  <!-- equation and the answer just given -->
  <text x="195" y="220" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="52" fill="#f7f0e2">7 × 8</text>
  <g transform="translate(123 248)">
    <rect x="-4" y="-4" width="72" height="93" rx="10" fill="none" stroke="#4f9d7c" stroke-width="2"/>
    <use href="#bigtile"/>
    <text x="32" y="55" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="44" fill="#16352b">5</text>
  </g>
  <g transform="translate(203 248)">
    <rect x="-4" y="-4" width="72" height="93" rx="10" fill="none" stroke="#4f9d7c" stroke-width="2"/>
    <use href="#bigtile"/>
    <text x="32" y="55" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="44" fill="#16352b">6</text>
  </g>

  <!-- verdict on an opaque carrier plate (ink never sits on the felt) -->
  <rect x="40" y="356" width="310" height="44" rx="8" fill="#0b211b"/>
  <text x="195" y="383" text-anchor="middle" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#f7f0e2"><tspan fill="#4f9d7c" font-weight="bold">Correct</tspan> · +1 point · pot 3 → 6</text>

  <!-- the decision: two outlined buttons -->
  <g font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.8" text-anchor="middle">
    <rect x="40" y="414" width="148" height="48" rx="8" fill="none" stroke="#c9a54a" stroke-width="1.5"/>
    <text x="114" y="443" fill="#e8cd85">TSUMO · BANK 7</text>
    <rect x="202" y="414" width="148" height="48" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="276" y="443" fill="#f7f0e2">NEXT ROUND</text>
  </g>
  <text x="195" y="484" text-anchor="middle" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#f7f0e2" fill-opacity="0.55">a miss loses the pot and the stick</text>

  <!-- the rail: the newest arrival slides off on its own (locked rack) -->
  <line x1="49" y1="506" x2="341" y2="506" stroke="#c9a54a" stroke-width="1"/>
  <g opacity="0.55">
    <line x1="268" y1="540" x2="292" y2="540" stroke="#e2795f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="274" y1="552" x2="292" y2="552" stroke="#e2795f" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(300 514) rotate(8 26 32)" opacity="0.8">
    <use href="#tile"/>
    <rect x="0" y="0" width="52" height="64" rx="6" fill="none" stroke="#b5432f" stroke-width="2"/>
    <text x="26" y="45" text-anchor="middle" font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" fill="#16352b">4</text>
  </g>

  <!-- the rack: 5 x 2, Endless's ten sockets -->
  <rect x="37" y="596" width="316" height="160" rx="12" fill="#0b211b"/>
  <g font-family="'EB Garamond', Georgia, 'Times New Roman', serif" font-size="34" fill="#16352b" text-anchor="middle">
    <g transform="translate(49 606)"><use href="#tile"/><text x="26" y="45">0</text></g>
    <g transform="translate(109 606)"><use href="#tile"/><text x="26" y="45">1</text></g>
    <g transform="translate(169 606)"><use href="#tile"/><text x="26" y="45">2</text></g>
    <g transform="translate(229 606)"><use href="#tile"/><text x="26" y="45">3</text></g>
    <g transform="translate(289 606)"><use href="#tile"/><text x="26" y="45">3</text></g>
    <g transform="translate(49 680)"><use href="#tile"/><text x="26" y="45">5</text></g>
    <g transform="translate(109 680)"><use href="#tile"/><text x="26" y="45">7</text></g>
    <g transform="translate(169 680)"><use href="#tile"/><text x="26" y="45">8</text></g>
    <g transform="translate(229 680)"><use href="#tile"/><text x="26" y="45">9</text></g>
    <g transform="translate(289 680)"><use href="#tile"/><text x="26" y="45">9</text></g>
  </g>
</svg>
