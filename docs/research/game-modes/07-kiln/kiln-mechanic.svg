<text x="48" y="214" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">In overflow: K, then two digit</text>
<text x="48" y="230" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">tiles that differ by 2. Sheds</text>
<text x="48" y="246" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">the one tile overflow asks for.</text>
<rect x="288" y="28" width="232" height="226" rx="14" fill="#0b211b"/>
<text x="304" y="54" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#e8cd85" letter-spacing="2" text-anchor="start">2 · IN THE KILN</text>
<text x="304" y="214" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">Both leave the hand. The kiln holds</text>
<text x="304" y="230" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">one socket for 2 submissions; it counts</text>
<text x="304" y="246" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">against the 10 and cannot be played.</text>
<rect x="544" y="28" width="232" height="226" rx="14" fill="#0b211b"/>
<text x="560" y="54" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#e8cd85" letter-spacing="2" text-anchor="start">3 · OUT</text>
<text x="560" y="214" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">The Neighbours tile fires in place</text>
<text x="560" y="230" font-family="'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#f7f0e2" fill-opacity="0.72" text-anchor="start">on the 2nd submission: new, like a reward.</text>
