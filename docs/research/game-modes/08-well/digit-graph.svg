<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img">
<title>The multiplication digit-pair graph and the opening wall</title>
<desc>Left: the ten digits as tiles on a circle, joined by 21 lines, one per digit pair that a two-digit product of 1 to 9 needs; heavier lines carry more facts. Digits 2 and 4 have seven partners each, 1 has six, 7 pairs only with 2 and 9 only with 4. Right: the fixed 5 by 3 opening wall, bottom row 1 8 4 5 3, middle 4 2 0 1 2, top 9 7 3 6 5, which spells 44 of 45 facts with touching pairs; only 8 x 8 = 64 is missing.</desc>
<defs>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8ec"/><stop offset="1" stop-color="#e6d7ba"/></linearGradient>
  <marker id="ah" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c9a54a"/></marker>
</defs>
