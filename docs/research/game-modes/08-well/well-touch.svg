<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" width="390" height="800" role="img">
<title>Well mode: answering 7 times 8 from touching tiles</title>
<desc>Phone mockup. The equation 7 x 8 has its first answer slot filled with a 5 and the second slot empty. Below, a 5 by 3 well of tiles: the 5's cell is an empty socket with a dashed gold outline. Its four neighbours, 9 left, 6 right, 3 above and 7 below, stay raised; every other tile lies flat. The 6 to the right carries the two-tone focus bezel. Submit is flat (disabled), Clear is live.</desc>
