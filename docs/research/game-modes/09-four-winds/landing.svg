<title id="t">Four Winds: the landing between South and West</title>
<desc id="d">Phone mockup. The wind tile has turned from South to West. The plate states West's twist, small tables with no faces, seven sleeps, and that North will be odd tables, zero sleeps. Three boon buttons are offered: one more socket, a wildcard, two faces. Below, the fifteen-socket tray that will close to ten, and the course strip of four winds with capacities 20, 15, 10 and 5.</desc>
