<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">Bite versus honesty: forced misses by economy</title>
  <desc id="d">Range plot. For an 85 percent learner who spells plausible wrong answers, the share of rounds whose answer the rack could not spell, as a range across the eight tables. Shipped rewards with a 10-tile rack: 44 to 62 percent for a player who knows the table's digits, 46 to 65 percent for a table-blind player. Echo with 15 tiles: 17 to 21 and 17 to 22. Echo with 20 tiles: 5 to 10 and 5 to 10. Echo plus pay-one with 10 tiles: 0 to 3 and 16 to 21. Echo plus pay-one with 15 tiles: 0 and 0, the recommended setting.</desc>
  <style>
    .ui { font-family: 'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <rect width="800" height="440" rx="12" fill="#0b211b"/>

  <text x="28" y="40" class="ui" font-size="17" fill="#f7f0e2">Forced misses: rounds the rack could not spell</text>
  <text x="28" y="62" class="ui" font-size="12" fill="#f7f0e2" fill-opacity="0.72">85% learner who spells a plausible wrong product on a miss · range across 2단–9단 · 2,000 sessions of 27 per table</text>

  <!-- legend -->
  <g class="ui" font-size="12" fill="#f7f0e2">
    <line x1="508" y1="92" x2="534" y2="92" stroke="#b08c30" stroke-width="2"/>
    <circle cx="534" cy="92" r="5" fill="#b08c30"/>
    <text x="544" y="96">knows which digits the table uses</text>
    <line x1="508" y1="114" x2="534" y2="114" stroke="#b08c30" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="534" cy="114" r="5" fill="#0b211b" stroke="#b08c30" stroke-width="2"/>
    <text x="544" y="118">table-blind discarder</text>
  </g>

  <!-- recommended row band -->
  <rect x="20" y="352" width="760" height="50" rx="8" fill="#14342a"/>

  <!-- grid and axis: x = 300 + 5.6 * percent -->
  <g stroke="#f7f0e2" stroke-opacity="0.1" stroke-width="1">
    <line x1="300" y1="140" x2="300" y2="404"/><line x1="356" y1="140" x2="356" y2="404"/>
    <line x1="412" y1="140" x2="412" y2="404"/><line x1="468" y1="140" x2="468" y2="404"/>
    <line x1="524" y1="140" x2="524" y2="404"/><line x1="580" y1="140" x2="580" y2="404"/>
    <line x1="636" y1="140" x2="636" y2="404"/><line x1="692" y1="140" x2="692" y2="404"/>
  </g>
  <g class="ui" font-size="11" fill="#f7f0e2" fill-opacity="0.55" text-anchor="middle">
    <text x="300" y="424">0%</text><text x="356" y="424">10</text><text x="412" y="424">20</text>
    <text x="468" y="424">30</text><text x="524" y="424">40</text><text x="580" y="424">50</text>
    <text x="636" y="424">60</text><text x="692" y="424">70%</text>
  </g>

  <!-- row labels -->
  <g class="ui" fill="#f7f0e2">
    <text x="28" y="164" font-size="13">Shipped rewards · 10 sockets</text>
    <text x="28" y="180" font-size="11" fill-opacity="0.55">pool filter only; fits §1.5 as written</text>
    <text x="28" y="216" font-size="13">Echo · 15 sockets</text>
    <text x="28" y="232" font-size="11" fill-opacity="0.55">a miss still burns its spelled tiles</text>
    <text x="28" y="268" font-size="13">Echo · 20 sockets</text>
    <text x="28" y="284" font-size="11" fill-opacity="0.55">a miss still burns its spelled tiles</text>
    <text x="28" y="320" font-size="13">Echo + pay-one · 10 sockets</text>
    <text x="28" y="336" font-size="11" fill-opacity="0.55">a miss costs one tile you choose</text>
    <text x="28" y="372" font-size="13">Echo + pay-one · 15 sockets</text>
    <text x="28" y="388" font-size="11" fill="#e8cd85">recommended</text>
  </g>

  <!-- data: aware = solid line + filled dots (y-7); blind = dashed + hollow (y+7) -->
  <g stroke="#b08c30" stroke-width="2">
    <!-- shipped: aware 43.5-61.5, blind 45.7-64.7 -->
    <line x1="543.6" y1="160" x2="644.4" y2="160"/>
    <line x1="555.9" y1="174" x2="662.3" y2="174" stroke-dasharray="4 3"/>
    <!-- echo 15: aware 17.1-21.1, blind 17.3-22.2 -->
    <line x1="395.8" y1="212" x2="418.2" y2="212"/>
    <line x1="396.9" y1="226" x2="424.3" y2="226" stroke-dasharray="4 3"/>
    <!-- echo 20: aware 4.7-10.1, blind 4.9-10.4 -->
    <line x1="326.3" y1="264" x2="356.6" y2="264"/>
    <line x1="327.4" y1="278" x2="358.2" y2="278" stroke-dasharray="4 3"/>
    <!-- echo + pay-one 10: aware 0.0-3.1, blind 15.6-21.4 -->
    <line x1="300" y1="316" x2="317.4" y2="316"/>
    <line x1="387.4" y1="330" x2="419.8" y2="330" stroke-dasharray="4 3"/>
  </g>
  <g fill="#b08c30">
    <circle cx="543.6" cy="160" r="5"/><circle cx="644.4" cy="160" r="5"/>
    <circle cx="395.8" cy="212" r="5"/><circle cx="418.2" cy="212" r="5"/>
    <circle cx="326.3" cy="264" r="5"/><circle cx="356.6" cy="264" r="5"/>
    <circle cx="300" cy="316" r="5"/><circle cx="317.4" cy="316" r="5"/>
    <circle cx="300" cy="370" r="5"/>
  </g>
  <g fill="#0b211b" stroke="#b08c30" stroke-width="2">
    <circle cx="555.9" cy="174" r="5"/><circle cx="662.3" cy="174" r="5"/>
    <circle cx="396.9" cy="226" r="5"/><circle cx="424.3" cy="226" r="5"/>
    <circle cx="327.4" cy="278" r="5"/><circle cx="358.2" cy="278" r="5"/>
    <circle cx="387.4" cy="330" r="5"/><circle cx="419.8" cy="330" r="5"/>
    <circle cx="300" cy="384" r="5" fill="#14342a"/>
  </g>

  <!-- direct labels: aware · blind -->
  <g class="ui" font-size="11" fill="#f7f0e2" fill-opacity="0.72">
    <text x="676" y="171">44–62 · 46–65%</text>
    <text x="438" y="223">17–21 · 17–22%</text>
    <text x="372" y="275">5–10 · 5–10%</text>
    <text x="434" y="327">0–3 · 16–21%</text>
    <text x="316" y="381" fill="#e8cd85" fill-opacity="1">0.0% for both</text>
  </g>
</svg>
