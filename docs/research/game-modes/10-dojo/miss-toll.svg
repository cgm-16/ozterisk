<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="t d">
  <title id="t">Dojo, 7단, a miss on 8 × 7 at round 14 of 27</title>
  <desc id="d">Korean interface. The feedback panel says 오답 and prints the whole fact 8 × 7 = 56, with the submitted answer 48. The spelled 4 and 8 have returned to the fifteen-socket rack with pale rings, and the player is giving up one tile, the 0, marked in vermilion, because a miss costs one tile of the player's choice. Notes below explain the four rules shown.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/>
      <stop offset="1" stop-color="#e6d7ba"/>
    </linearGradient>
    <g id="tile">
      <rect width="48" height="60" rx="6" fill="#b3a184"/>
      <rect width="48" height="55" rx="6" fill="url(#face)"/>
    </g>
  </defs>
  <style>
    .num { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; }
    .ui { font-family: 'Zen Kaku Gothic New', 'Helvetica Neue', Arial, sans-serif; }
    .ko { font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }
  </style>

  <!-- felt -->
  <rect width="390" height="844" fill="#14342a"/>

  <!-- mode chip -->
  <rect x="16" y="18" width="92" height="26" rx="13" fill="#0b211b" stroke="#9a7f36" stroke-width="1"/>
  <text x="62" y="36" text-anchor="middle" class="ko" font-size="13" fill="#e8cd85">도장 · 7단</text>

  <!-- HUD on a carrier plate -->
  <rect x="16" y="56" width="358" height="62" rx="10" fill="#0b211b"/>
  <text x="32" y="76" class="ko" font-size="11" fill="#f7f0e2" fill-opacity="0.55">라운드</text>
  <text x="32" y="106" class="num" font-size="28" fill="#f7f0e2">14<tspan font-size="18" fill-opacity="0.55">/27</tspan></text>
  <text x="150" y="76" class="ko" font-size="11" fill="#f7f0e2" fill-opacity="0.55">점수</text>
  <text x="150" y="104" class="num" font-size="22" fill="#f7f0e2">11</text>
  <text x="225" y="76" class="ko" font-size="11" fill="#f7f0e2" fill-opacity="0.55">연속 정답</text>
  <text x="225" y="104" class="num" font-size="22" fill="#f7f0e2">0</text>
  <text x="318" y="76" class="ko" font-size="11" fill="#f7f0e2" fill-opacity="0.55">바퀴</text>
  <circle cx="322" cy="97" r="4.5" fill="#c9a54a"/>
  <circle cx="337" cy="97" r="4.5" fill="#c9a54a"/>
  <circle cx="352" cy="97" r="4" fill="none" stroke="#c9a54a" stroke-width="1.5"/>

  <!-- equation -->
  <text x="195" y="186" text-anchor="middle" class="num" font-size="54" fill="#f7f0e2">8 × 7</text>

  <!-- feedback plate: the whole fact -->
  <rect x="24" y="210" width="342" height="104" rx="10" fill="#0b211b"/>
  <text x="44" y="236" class="ko" font-size="13" font-weight="700" letter-spacing="1" fill="#e2795f">오답</text>
  <text x="44" y="276" class="num" font-size="32" fill="#f7f0e2">8 × 7 = 56</text>
  <text x="44" y="300" class="ko" font-size="13" fill="#f7f0e2" fill-opacity="0.72">제출한 답: 48</text>
  <text x="346" y="300" text-anchor="end" class="ko" font-size="11" fill="#f7f0e2" fill-opacity="0.55">3바퀴째에 다시 나와요</text>

  <!-- toll prompt -->
  <rect x="55" y="330" width="280" height="34" rx="8" fill="#0b211b"/>
  <text x="195" y="352" text-anchor="middle" class="ko" font-size="14" fill="#f7f0e2">내줄 타일 1개를 고르세요.</text>

  <!-- rack: 15 sockets, 5 x 3 -->
  <rect x="55" y="376" width="280" height="208" rx="10" fill="#0b211b"/>
  <!-- row 0 -->
  <rect x="61" y="376" width="52" height="66" rx="8" fill="none" stroke="#b5432f" stroke-width="2"/>
  <use xlink:href="#tile" x="63" y="379"/><text x="87" y="416" text-anchor="middle" class="num" font-size="30" fill="#16352b">0</text>
  <use xlink:href="#tile" x="117" y="384"/><text x="141" y="421" text-anchor="middle" class="num" font-size="30" fill="#16352b">1</text>
  <use xlink:href="#tile" x="171" y="384"/><text x="195" y="421" text-anchor="middle" class="num" font-size="30" fill="#16352b">1</text>
  <use xlink:href="#tile" x="225" y="384"/><text x="249" y="421" text-anchor="middle" class="num" font-size="30" fill="#16352b">2</text>
  <use xlink:href="#tile" x="279" y="384"/><text x="303" y="421" text-anchor="middle" class="num" font-size="30" fill="#16352b">3</text>
  <!-- row 1 -->
  <use xlink:href="#tile" x="63" y="450"/><text x="87" y="487" text-anchor="middle" class="num" font-size="30" fill="#16352b">4</text>
  <rect x="115" y="448" width="52" height="64" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.6" stroke-width="2"/>
  <use xlink:href="#tile" x="117" y="450"/><text x="141" y="487" text-anchor="middle" class="num" font-size="30" fill="#16352b">4</text>
  <use xlink:href="#tile" x="171" y="450"/><text x="195" y="487" text-anchor="middle" class="num" font-size="30" fill="#16352b">5</text>
  <use xlink:href="#tile" x="225" y="450"/><text x="249" y="487" text-anchor="middle" class="num" font-size="30" fill="#16352b">6</text>
  <use xlink:href="#tile" x="279" y="450"/><text x="303" y="487" text-anchor="middle" class="num" font-size="30" fill="#16352b">6</text>
  <!-- row 2 -->
  <use xlink:href="#tile" x="63" y="516"/><text x="87" y="553" text-anchor="middle" class="num" font-size="30" fill="#16352b">7</text>
  <rect x="115" y="514" width="52" height="64" rx="8" fill="none" stroke="#f7f0e2" stroke-opacity="0.6" stroke-width="2"/>
  <use xlink:href="#tile" x="117" y="516"/><text x="141" y="553" text-anchor="middle" class="num" font-size="30" fill="#16352b">8</text>
  <use xlink:href="#tile" x="171" y="516"/><text x="195" y="553" text-anchor="middle" class="num" font-size="30" fill="#16352b">8</text>
  <use xlink:href="#tile" x="225" y="516"/><text x="249" y="553" text-anchor="middle" class="num" font-size="30" fill="#16352b">9</text>
  <use xlink:href="#tile" x="279" y="516"/><text x="303" y="553" text-anchor="middle" class="num" font-size="30" fill="#16352b">9</text>

  <!-- note band for the reader (not interface) -->
  <rect x="0" y="608" width="390" height="236" fill="#071711"/>
  <text x="20" y="636" class="ui" font-size="11" letter-spacing="1.5" fill="#c9a54a">DOJO · 7단 · A MISS, ROUND 14 OF 27</text>
  <g class="ui" font-size="12.5" fill="#f7f0e2">
    <text x="20" y="664"><tspan fill="#c9a54a">1</tspan>  The feedback prints the whole fact, 8 × 7 = 56.</text>
    <text x="20" y="690"><tspan fill="#c9a54a">2</tspan>  The spelled 4 and 8 come back (pale rings), so</text>
    <text x="36" y="707" fill-opacity="0.72">an honest error never burns the table's digits.</text>
    <text x="20" y="733"><tspan fill="#c9a54a">3</tspan>  A miss costs one tile the player chooses: here</text>
    <text x="36" y="750" fill-opacity="0.72">the 0, which no 7단 answer uses (vermilion).</text>
    <text x="20" y="776"><tspan fill="#c9a54a">4</tspan>  8 × 7 comes back in pass 3 (pips, top right):</text>
    <text x="36" y="793" fill-opacity="0.72">three shuffled passes test every fact three times,</text>
    <text x="36" y="810" fill-opacity="0.72">whatever the player does.</text>
  </g>
</svg>
