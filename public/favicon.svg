<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ozterisk">
  <!-- background: token felt-700 in src/styles/tokens/colors.css, the felt itself, the default canvas -->
  <rect width="32" height="32" rx="6" fill="#14342a"/>
  <!-- mark: the six-pointed asterisk, token gold-500 in src/styles/tokens/colors.css, the brand accent -->
  <g fill="#c9a54a">
    <path id="spike" d="M16 16 L12.8 11 L16 3 L19.2 11 Z"/>
